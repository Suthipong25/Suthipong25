<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Suthipong (Dodge) — Full-Stack and AI Software Engineer">
  <title>Suthipong (Dodge) — Full-Stack &amp; AI Software Engineer</title>
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <radialGradient id="glow-emerald-light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 40) rotate(135) scale(440 280)">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
    <clipPath id="card-clip-light">
      <rect x="1" y="1" width="1198" height="318" rx="15"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .status-dot { animation: pulse 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .status-dot { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#card-clip-light)">
    <rect width="1200" height="320" fill="url(#bg-light)"/>
    <rect width="1200" height="320" fill="url(#grid-light)"/>
    <rect width="1200" height="320" fill="url(#glow-emerald-light)"/>
  </g>

  <!-- Outer Frame -->
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="15.25" stroke="#D0D7DE" stroke-width="1.5"/>

  <!-- Left Column: Identity & Value Prop -->
  <g transform="translate(60, 48)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="332" height="28" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#059669" class="status-dot"/>
    <text x="29" y="18" class="mono" font-size="11.5" font-weight="600" fill="#047857" letter-spacing="0.4">OPEN TO OPPORTUNITIES · BANGKOK, TH</text>

    <!-- Display Name -->
    <text x="0" y="88" class="sans" font-size="46" font-weight="700" fill="#0F172A" letter-spacing="-1">Suthipong</text>
    <text x="228" y="88" class="sans" font-size="46" font-weight="400" fill="#64748B" letter-spacing="-0.5">(Dodge)</text>

    <!-- Role Title -->
    <text x="0" y="128" class="sans" font-size="21" font-weight="600" fill="#047857" letter-spacing="-0.2">Full-Stack &amp; AI Software Engineer</text>

    <!-- Concise Tagline -->
    <text x="0" y="162" class="sans" font-size="15.5" font-weight="400" fill="#475569">Shipping production Web, Mobile &amp; Multimodal AI systems for Logistics &amp; SaaS.</text>

    <!-- Tech Focus Chips -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="166" height="30" rx="7" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
      <text x="14" y="19.5" class="mono" font-size="12" fill="#1F2328">Next.js · TypeScript</text>

      <rect x="178" y="0" width="182" height="30" rx="7" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
      <text x="192" y="19.5" class="mono" font-size="12" fill="#1F2328">PostgreSQL · Supabase</text>

      <rect x="372" y="0" width="160" height="30" rx="7" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
      <text x="386" y="19.5" class="mono" font-size="12" fill="#1F2328">Gemini AI · Flutter</text>
    </g>
  </g>

  <!-- Right Column: Minimal Engineering Spec Card -->
  <g transform="translate(756, 48)">
    <rect x="0" y="0" width="384" height="224" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#D0D7DE" stroke-width="1.2"/>
    <!-- Window Bar -->
    <line x1="0" y1="36" x2="384" y2="36" stroke="#EAEEF2" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#D0D7DE"/>
    <circle cx="36" cy="18" r="4.5" fill="#D0D7DE"/>
    <circle cx="52" cy="18" r="4.5" fill="#D0D7DE"/>
    <text x="72" y="22" class="mono" font-size="11.5" fill="#57606A">engineer.profile.ts</text>

    <!-- Code Body -->
    <g transform="translate(22, 64)" class="mono" font-size="12.5">
      <text x="0" y="0">
        <tspan fill="#CF222E">export const</tspan>
        <tspan fill="#8250DF"> profile</tspan>
        <tspan fill="#1F2328"> = {</tspan>
      </text>

      <text x="16" y="26">
        <tspan fill="#0550AE">focus</tspan><tspan fill="#57606A">: </tspan>
        <tspan fill="#0A3069">"Full-Stack &amp; Applied AI"</tspan><tspan fill="#57606A">,</tspan>
      </text>

      <text x="16" y="52">
        <tspan fill="#0550AE">domains</tspan><tspan fill="#57606A">: [</tspan>
        <tspan fill="#0A3069">"Logistics"</tspan><tspan fill="#57606A">, </tspan>
        <tspan fill="#0A3069">"FinTech SaaS"</tspan><tspan fill="#57606A">],</tspan>
      </text>

      <text x="16" y="78">
        <tspan fill="#0550AE">aiStack</tspan><tspan fill="#57606A">: </tspan>
        <tspan fill="#0A3069">"Gemini Multimodal / OCR"</tspan><tspan fill="#57606A">,</tspan>
      </text>

      <text x="16" y="104">
        <tspan fill="#0550AE">impact</tspan><tspan fill="#57606A">: </tspan>
        <tspan fill="#116329">"Automating real workflows"</tspan>
      </text>

      <text x="0" y="130">
        <tspan fill="#1F2328">};</tspan>
      </text>
    </g>
  </g>
</svg>
