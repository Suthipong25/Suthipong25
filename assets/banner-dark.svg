<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Suthipong (Dodge) — Full-Stack and AI Software Engineer">
  <title>Suthipong (Dodge) — Full-Stack &amp; AI Software Engineer</title>
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="60%" stop-color="#0F1520"/>
      <stop offset="100%" stop-color="#0B131C"/>
    </linearGradient>
    <radialGradient id="glow-emerald" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 40) rotate(135) scale(460 300)">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-blue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 300) rotate(-30) scale(360 220)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-dark" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363D" stroke-width="0.7" stroke-opacity="0.35"/>
    </pattern>
    <clipPath id="card-clip">
      <rect x="1" y="1" width="1198" height="318" rx="15"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .status-dot { animation: pulse 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .status-dot { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#card-clip)">
    <rect width="1200" height="320" fill="url(#bg-dark)"/>
    <rect width="1200" height="320" fill="url(#grid-dark)"/>
    <rect width="1200" height="320" fill="url(#glow-emerald)"/>
    <rect width="1200" height="320" fill="url(#glow-blue)"/>
  </g>

  <!-- Outer Frame -->
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="15.25" stroke="#30363D" stroke-width="1.5"/>

  <!-- Left Column: Identity & Value Prop -->
  <g transform="translate(60, 48)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="332" height="28" rx="14" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#34D399" class="status-dot"/>
    <text x="29" y="18" class="mono" font-size="11.5" font-weight="600" fill="#6EE7B7" letter-spacing="0.4">OPEN TO OPPORTUNITIES · BANGKOK, TH</text>

    <!-- Display Name -->
    <text x="0" y="88" class="sans" font-size="46" font-weight="700" fill="#F0F6FC" letter-spacing="-1">Suthipong</text>
    <text x="228" y="88" class="sans" font-size="46" font-weight="400" fill="#8B949E" letter-spacing="-0.5">(Dodge)</text>

    <!-- Role Title -->
    <text x="0" y="128" class="sans" font-size="21" font-weight="600" fill="#34D399" letter-spacing="-0.2">Full-Stack &amp; AI Software Engineer</text>

    <!-- Concise Tagline -->
    <text x="0" y="162" class="sans" font-size="15.5" font-weight="400" fill="#9CA3AF">Shipping production Web, Mobile &amp; Multimodal AI systems for Logistics &amp; SaaS.</text>

    <!-- Tech Focus Chips -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="166" height="30" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="14" y="19.5" class="mono" font-size="12" fill="#E6EDF3">Next.js · TypeScript</text>

      <rect x="178" y="0" width="182" height="30" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="192" y="19.5" class="mono" font-size="12" fill="#E6EDF3">PostgreSQL · Supabase</text>

      <rect x="372" y="0" width="160" height="30" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="386" y="19.5" class="mono" font-size="12" fill="#E6EDF3">Gemini AI · Flutter</text>
    </g>
  </g>

  <!-- Right Column: Minimal Engineering Spec Card -->
  <g transform="translate(756, 48)">
    <rect x="0" y="0" width="384" height="224" rx="12" fill="#161B22" fill-opacity="0.92" stroke="#30363D" stroke-width="1.2"/>
    <!-- Window Bar -->
    <line x1="0" y1="36" x2="384" y2="36" stroke="#21262D" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#30363D"/>
    <circle cx="36" cy="18" r="4.5" fill="#30363D"/>
    <circle cx="52" cy="18" r="4.5" fill="#30363D"/>
    <text x="72" y="22" class="mono" font-size="11.5" fill="#8B949E">engineer.profile.ts</text>

    <!-- Code Body -->
    <g transform="translate(22, 64)" class="mono" font-size="12.5">
      <text x="0" y="0">
        <tspan fill="#FF7B72">export const</tspan>
        <tspan fill="#D2A8FF"> profile</tspan>
        <tspan fill="#E6EDF3"> = {</tspan>
      </text>

      <text x="16" y="26">
        <tspan fill="#79C0FF">focus</tspan><tspan fill="#8B949E">: </tspan>
        <tspan fill="#A5D6FF">"Full-Stack &amp; Applied AI"</tspan><tspan fill="#8B949E">,</tspan>
      </text>

      <text x="16" y="52">
        <tspan fill="#79C0FF">domains</tspan><tspan fill="#8B949E">: [</tspan>
        <tspan fill="#A5D6FF">"Logistics"</tspan><tspan fill="#8B949E">, </tspan>
        <tspan fill="#A5D6FF">"FinTech SaaS"</tspan><tspan fill="#8B949E">],</tspan>
      </text>

      <text x="16" y="78">
        <tspan fill="#79C0FF">aiStack</tspan><tspan fill="#8B949E">: </tspan>
        <tspan fill="#A5D6FF">"Gemini Multimodal / OCR"</tspan><tspan fill="#8B949E">,</tspan>
      </text>

      <text x="16" y="104">
        <tspan fill="#79C0FF">impact</tspan><tspan fill="#8B949E">: </tspan>
        <tspan fill="#7EE787">"Automating real workflows"</tspan>
      </text>

      <text x="0" y="130">
        <tspan fill="#E6EDF3">};</tspan>
      </text>
    </g>
  </g>
</svg>
